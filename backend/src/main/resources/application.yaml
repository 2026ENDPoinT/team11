server:
  port: ${PORT:8080} # 호스팅(Railway/Render 등)이 PORT 환경변수로 바인딩 포트를 줌

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sleepsync}
    username: ${DB_USERNAME:sleepsync}
    password: ${DB_PASSWORD:sleepsync}
    hikari:
      connection-init-sql: "SET TIME ZONE 'Asia/Seoul'" # SQL 안 날짜 계산용. OffsetDateTime 오프셋 복원은 common.OffsetDateTimeConverter가 함
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
  # Jackson 기본 time-zone이 UTC라 OffsetDateTime 역직렬화 시 입력받은 +09:00이 Z로 바뀐다 → KST로 고정.
  # 반드시 spring: 아래 중첩(spring.jackson.time-zone). 최상위 jackson:은 적용 안 됨.
  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiry-seconds: 1800
  refresh-token-expiry-days: 14

# AI 서버(통합판 AI-01~06) 주소는 AI팀 확인 전까지 비워 둔다. 비어 있으면 NORMAL은 규칙 폴백, FOCUS/EXAM은 503.
# 읽기 타임아웃은 AI 계산 예산(tonight 2.5초, exam/focus 10초)에 정리·네트워크 여유를 더한 값.
ai:
  base-url: ${AI_BASE_URL:}
  internal-key: ${AI_INTERNAL_KEY:}
  timeout:
    tonight-seconds: 4
    exam-seconds: 12
    focus-seconds: 12

