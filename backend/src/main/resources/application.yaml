server:
  port: ${PORT:8080} # Railway는 PORT 환경변수로 바인딩할 포트를 동적으로 줌

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sleepsync}
    username: ${DB_USERNAME:sleepsync}
    password: ${DB_PASSWORD:sleepsync}
    hikari:
      connection-init-sql: "SET TIME ZONE 'Asia/Seoul'" # SQL 안에서 날짜 계산 시 세션 타임존을 KST로(OffsetDateTime 오프셋 복원은 이것만으로 안 되고 common.OffsetDateTimeConverter가 함, CLAUDE.md §4)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true

# Jackson 기본 time-zone이 UTC라 OffsetDateTime 역직렬화 시 +09:00 입력도 Z로 정규화됨(adjust-dates-to-context-time-zone 기본 true) → +09:00로 고정
jackson:
  time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiry-seconds: 1800
  refresh-token-expiry-days: 14

# AI 서버 호스팅 위치 미정(CLAUDE.md §10) — base-url 비우면 AiClient가 호출 자체를 생략하고 규칙 폴백한다.
ai:
  base-url: ${AI_BASE_URL:}
  internal-key: ${AI_INTERNAL_KEY:}
  timeout-seconds: 4

