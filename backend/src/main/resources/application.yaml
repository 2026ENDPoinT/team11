spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sleepsync}
    username: ${DB_USERNAME:sleepsync}
    password: ${DB_PASSWORD:sleepsync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiry-seconds: 1800
  refresh-token-expiry-days: 14
